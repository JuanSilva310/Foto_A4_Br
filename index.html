<!DOCTYPE html>  <html lang="pt-BR">  
<head>  
<meta charset="UTF-8">  
<title>Foto A4 Br – PDF Híbrido</title>  
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>  
<style>  
html, body {
  overscroll-behavior-y: contain;
  touch-action: pan-x pan-y;
}
*{box-sizing:border-box}  
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#e6e6e6;display:flex;flex-direction:column;height:100vh}  
.topbar{height:70px;background:#c62828;display:flex;align-items:center;justify-content:center;flex-shrink:0}  
.logo{font-size:44px;font-weight:900;letter-spacing:1px;text-shadow:0 2px 4px rgba(0,0,0,.25);user-select:none}  
.logo .foto{color:#fff}.logo .a4{color:#000;margin:0 6px}.logo .br{color:#2e7d32}  
.main{flex:1;display:flex}  
.preview-area{flex:1;display:flex;align-items:flex-start;justify-content:center;padding-top:8px;background:#dcdcdc;overflow:auto}  
.paper{background:#fff;box-shadow:0 8px 20px rgba(0,0,0,.3);border:2px solid #888;transform:scale(.85);transform-origin:top center;display:grid}  
.cell{border:1px dashed #bbb;overflow:hidden}  
.cell.circle{border-radius:50%}  
.cell img{width:100%;height:100%}  
.controls{width:300px;background:#c62828;color:#fff;padding:16px;overflow-y:auto}  
.controls h2{font-size:18px;margin-top:20px;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:4px}  
.controls label{display:block;margin-top:10px;font-size:14px}  
.controls input,.controls select{width:100%;margin-top:4px;padding:6px;font-size:14px}  
.info-box{background:rgba(255,255,255,.15);padding:8px;margin-top:10px;font-size:14px}  
.btn{margin-top:14px;width:100%;padding:10px;font-size:16px;background:#fff;color:#c62828;border:none;cursor:pointer;font-weight:bold}  

</style>  
</head>  
<body>  <div class="topbar">  
  <div class="logo">  
    <span class="foto">Foto</span>  
    <span class="a4">A4</span>  
    <span class="br">Br</span>  
  </div>  
</div>  <div class="main">  
<div class="preview-area"><div id="preview"></div></div>  <div class="controls">  
<h2>Página</h2>  
<label>Orientação  
<select id="orientation">  
<option value="portrait">Vertical</option>  
<option value="landscape">Horizontal</option>  
</select>  
</label>  <label>Margem (cm)
<input type="number" id="margin" value="1" step="0.1">
</label>

<h2>Grade</h2>  
<label>Linhas<input type="number" id="rows" value="2" min="1"></label>  
<label>Colunas<input type="number" id="cols" value="2" min="1"></label>  
<label>Espaço entre fotos (cm)<input type="number" id="gap" value="0.3" step="0.1"></label>  <h2>Tipo de grade</h2>  
<select id="shapeMode">  
<option value="rect">Retangular</option>  
<option value="circle">Circular</option>  
</select>  <h2>Tamanho</h2>  
<label id="wLabel">Largura (cm)<input type="number" id="cellWInput" step="0.1" placeholder="auto"></label>  
<label id="hLabel">Altura (cm)<input type="number" id="cellHInput" step="0.1" placeholder="auto"></label>  
<label id="dLabel" style="display:none">Diâmetro (cm)<input type="number" id="cellDInput" step="0.1" placeholder="auto"></label>  <div class="info-box" id="cellSize">Automático</div>  <h2>Fotos</h2>  
<input type="file" id="images" multiple accept="image/*">  
<div class="info-box" id="imgCount">0 fotos carregadas</div>  <h2>Repetições</h2>  
<div class="info-box" id="repeatBox">Cada foto = 1x</div>  <h2>Ajuste da foto</h2>  
<select id="fitMode">  
<option value="cover">Preencher</option>  
<option value="contain">Ajustar</option>  
<option value="stretch">Esticar</option>  
</select>  <h2>Exportar</h2>

<button class="btn" id="clearAll" style="background:#ffebee;color:#c62828">
Limpar projeto
</button>

<button class="btn" id="exportPDF">Salvar em PDF (Híbrido)</button>

<div style="margin-top:10px;background:#fff;height:8px;border-radius:4px;overflow:hidden">
  <div id="progressBar" style="height:100%;width:0%;background:#2e7d32;transition:0.3s"></div>
</div>

</div>  
</div>  <script>  
let startY = 0;

window.addEventListener('touchstart', e => {
  startY = e.touches[0].clientY;
}, { passive: true });

window.addEventListener('touchmove', e => {
  const currentY = e.touches[0].clientY;
  if (window.scrollY === 0 && currentY > startY) {
    e.preventDefault();
  }
}, { passive: false });

const preview=document.getElementById('preview');  
const imagesInput=document.getElementById('images');  
const imgCountBox=document.getElementById('imgCount');  
const cellSizeBox=document.getElementById('cellSize');  
const repeatBox=document.getElementById('repeatBox');  
const shapeMode=document.getElementById('shapeMode');  
let images=[],repeats=[];  
  
function cmToPx(cm){return cm*37.7952755906}  
  
imagesInput.addEventListener('change',()=>{  
 images=Array.from(imagesInput.files);  
 repeats=images.map(()=>1);  
 imgCountBox.textContent=images.length+' fotos carregadas';  
 repeatBox.innerHTML=images.map((_,i)=>`Foto ${i+1}: <input type="number" min="1" value="1" onchange="repeats[${i}]=+this.value||1;render()">`).join('<br>');  
 render();  
});  
  
['orientation','rows','cols','margin','gap','cellWInput','cellHInput','cellDInput','fitMode','shapeMode']  
.forEach(id=>{  
 const el=document.getElementById(id);  
 if(el) el.addEventListener('input',render);  
});  
  
shapeMode.addEventListener('change',()=>{  
 const isCircle=shapeMode.value==='circle';  
 document.getElementById('wLabel').style.display=isCircle?'none':'block';  
 document.getElementById('hLabel').style.display=isCircle?'none':'block';  
 document.getElementById('dLabel').style.display=isCircle?'block':'none';  
 render();  
});  
  
function expandedImages(){  
 const out=[];  
 images.forEach((img,i)=>{for(let r=0;r<repeats[i];r++) out.push(img)});  
 return out;  
}  
  
function render(){  
 const orientation=document.getElementById('orientation').value;  
 const rows=+document.getElementById('rows').value;  
 const cols=+document.getElementById('cols').value;  
 const margin=+document.getElementById('margin').value;  
 const gap=+document.getElementById('gap').value;  
 const fit=document.getElementById('fitMode').value;  
 const isCircle=shapeMode.value==='circle';  
  
 const pageW=orientation==='portrait'?21:29.7;  
 const pageH=orientation==='portrait'?29.7:21;  
  
 let usableW=pageW-margin*2-gap*(cols-1);  
 let usableH=pageH-margin*2-gap*(rows-1);  
  
 let cellW,cellH;  
 if(isCircle){  
  const d=+document.getElementById('cellDInput').value || Math.min(usableW/cols,usableH/rows);  
  cellW=d; cellH=d;  
  cellSizeBox.innerHTML=`Diâmetro: ${d.toFixed(2)} cm`;  
 }else{  
  const mw=+document.getElementById('cellWInput').value;  
  const mh=+document.getElementById('cellHInput').value;  
  cellW=mw>0?mw:usableW/cols;  
  cellH=mh>0?mh:usableH/rows;  
  cellSizeBox.innerHTML=`Largura: ${cellW.toFixed(2)} cm<br>Altura: ${cellH.toFixed(2)} cm`;  
 }  
  
 preview.innerHTML='';  
 const paper=document.createElement('div');  
 paper.className='paper';  
 paper.style.width=cmToPx(pageW)+'px';  
 paper.style.height=cmToPx(pageH)+'px';  
 paper.style.padding=cmToPx(margin)+'px';  
 paper.style.gap=cmToPx(gap)+'px';  
 paper.style.gridTemplateColumns=`repeat(${cols},${cmToPx(cellW)}px)`;  
 paper.style.gridTemplateRows=`repeat(${rows},${cmToPx(cellH)}px)`;  
  
 const imgs=expandedImages();  
 for(let i=0;i<rows*cols;i++){  
  const cell=document.createElement('div');  
  cell.className='cell'+(isCircle?' circle':'');  
  if(imgs[i]){  
    const im=document.createElement('img');  
    im.src=URL.createObjectURL(imgs[i]);  
    im.style.objectFit=fit==='stretch'?'fill':fit;  
    cell.appendChild(im);  
  }  
  paper.appendChild(cell);  
 }  
 preview.appendChild(paper);  
}  
  
/* ===== PDF FUNCIONAL COM CORTE CIRCULAR ===== */  
document.getElementById('exportPDF').onclick = async ()=>{

  const { jsPDF } = window.jspdf;

  const orientation=document.getElementById('orientation').value;  
  const rows=+document.getElementById('rows').value;  
  const cols=+document.getElementById('cols').value;  
  const margin=+document.getElementById('margin').value;  
  const gap=+document.getElementById('gap').value;  
  const fit=document.getElementById('fitMode').value;  
  const isCircle=shapeMode.value==='circle';  

const progressBar = document.getElementById('progressBar');
const total = rows * cols;
let done = 0;

// reset da barra
progressBar.style.width = "0%";

  const pageW=orientation==='portrait'?21:29.7;  
  const pageH=orientation==='portrait'?29.7:21;  

  const cellW=isCircle  
    ? (+document.getElementById('cellDInput').value || (pageW-margin*2-gap*(cols-1))/cols)  
    : (+document.getElementById('cellWInput').value || (pageW-margin*2-gap*(cols-1))/cols);  

  const cellH=isCircle?cellW:(+document.getElementById('cellHInput').value || (pageH-margin*2-gap*(rows-1))/rows);  

  const imgs=expandedImages();  
  const pdf=new jsPDF({orientation,unit:'cm',format:'a4'});  

  let x=margin,y=margin;  

  for(let i=0;i<rows*cols;i++){  

    if(imgs[i]){  

      const img=new Image();  
      img.src=URL.createObjectURL(imgs[i]);  

      await new Promise((resolve)=>{
        img.onload = resolve;
      });

      let rw=cellW,rh=cellH;  

      if(fit==='contain'){  
        const ratio=Math.min(cellW/img.width,cellH/img.height);  
        rw=img.width*ratio;  
        rh=img.height*ratio;  
      }  

      // 🔥 Canvas leve SEM redimensionamento pesado
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;

      const ctx = canvas.getContext('2d');

      // fundo branco evita bug
      ctx.fillStyle = "#fff";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.drawImage(img,0,0);

      if(isCircle){

        const s = Math.max(canvas.width, canvas.height);

        const c2 = document.createElement('canvas');
        c2.width = s;
        c2.height = s;

        const ctx2 = c2.getContext('2d');

        ctx2.fillStyle="#fff";
        ctx2.fillRect(0,0,s,s);

        ctx2.beginPath();
        ctx2.arc(s/2,s/2,s/2,0,Math.PI*2);
        ctx2.closePath();
        ctx2.clip();

        ctx2.drawImage(
          canvas,
          (s - canvas.width)/2,
          (s - canvas.height)/2
        );

        pdf.addImage(c2.toDataURL('image/png'),'PNG',x,y,cellW,cellH);

      } else {

        pdf.addImage(
          canvas.toDataURL('image/png'),
          'PNG',
          x + (cellW - rw)/2,
          y + (cellH - rh)/2,
          rw,
          rh
        );

      }

    }

done++;

const percent = Math.round((done / total) * 100);
progressBar.style.width = percent + "%";

    x+=cellW+gap;  
    if((i+1)%cols===0){
      x=margin;
      y+=cellH+gap;
    }  
  }  

  pdf.save('foto-a4-hibrido.pdf');  

setTimeout(()=>{
  progressBar.style.width = "0%";
},2000);

};

document.getElementById('clearAll').onclick = () => {
  if (!confirm('Isso vai limpar tudo. Deseja continuar?')) return;

  images = [];
  repeats = [];

  document.getElementById('images').value = '';
  document.getElementById('rows').value = 2;
  document.getElementById('cols').value = 2;
  document.getElementById('margin').value = 1;
  document.getElementById('gap').value = 0.3;
  document.getElementById('cellWInput').value = '';
  document.getElementById('cellHInput').value = '';
  document.getElementById('cellDInput').value = '';
  document.getElementById('shapeMode').value = 'rect';
  document.getElementById('fitMode').value = 'cover';

  imgCountBox.textContent = '0 fotos carregadas';
  repeatBox.innerHTML = 'Cada foto = 1x';
  cellSizeBox.innerHTML = 'Automático'; 

      render ();
};


render();  
</script>  <footer style="text-align:center;padding:10px;font-size:12px;color:#555">

</html>
